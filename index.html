<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="gaming icon.png">
    <link rel="icon" href="icon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字防禦戰 MVP v2.9 (布布專屬商店版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { width: 100%; max-width: 500px; background-color: #2b2b36; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 20px; position: relative; box-sizing: border-box; overflow: hidden; }

        #start-screen, #transition-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e24; z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #transition-screen { background-color: #15151a; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .show-transition { opacity: 1 !important; pointer-events: all !important; }
        .title-text { font-size: 2.5rem; color: #7bed9f; margin-bottom: 30px; font-weight: bold; }
        .start-btn { background-color: #1e90ff; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.5rem; cursor: pointer; font-weight: bold; }
        .start-btn:active { transform: scale(0.95); }
        .reset-btn { margin-top: 20px; background: transparent; color: #ff4757; border: 1px solid #ff4757; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: 0.2s;}
        .reset-btn:hover { background: #ff4757; color: white; }
        .transition-text { color: #f5f5f5; font-size: 1.5rem; margin-bottom: 20px; letter-spacing: 2px; text-align: center; line-height: 1.5; }
        .walking-anim { font-size: 3rem; animation: walkAcross 2s linear infinite; }
        @keyframes walkAcross { 0% { transform: translateX(-50px); } 50% { transform: translateX(50px); } 100% { transform: translateX(-50px); } }

        #special-alert { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; color: #ffdd59; font-weight: bold; text-shadow: 0 0 20px #ff4757; z-index: 60; display: none; text-align: center; width: 100%; pointer-events: none; }
        .alert-anim { animation: popAlert 2.5s ease-in-out forwards; }
        @keyframes popAlert { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 85% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        
        /* 確保五彩紙屑能在最上層顯示 */
        .confetti { position: absolute; width: 10px; height: 20px; top: -20px; animation: fall linear forwards; z-index: 100; pointer-events: none;}
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        #level-display { text-align: center; color: #a4b0be; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
        #status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background-color: #1a1a20; border-radius: 8px; }
        .stat-box { text-align: center; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .heart { color: #ff4757; font-size: 1.2rem; }
        .coin-text { color: #ffdd59; font-size: 1.2rem; }
        .boss-hp-text { color: #2ed573; font-size: 1.2rem; }

        /* 商店按鈕樣式 */
        .shop-icon-btn { background: #ffaa00; color: #1e1e24; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; margin-left: 5px; transition: transform 0.1s; }
        .shop-icon-btn:hover { background: #ffdd59; transform: scale(1.1); }
        .shop-icon-btn:active { transform: scale(0.9); }

        #boss-area { height: 150px; background-color: #3d3d4e; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 4rem; margin-bottom: 20px; position: relative; overflow: hidden; }
        .attack-slash { position: absolute; width: 150%; height: 20px; background-color: #2ed573; box-shadow: 0 0 15px #2ed573, 0 0 30px #ffffff; opacity: 0; transform: rotate(-45deg) translate(-100%, -100%); pointer-events: none; z-index: 5;}
        .play-slash { animation: slashAnimation 0.25s ease-out; }
        .slash-2x { background-color: #ffdd59; box-shadow: 0 0 20px #ffdd59, 0 0 40px #ffffff; height: 30px; animation: slashAnimCrit 0.25s ease-out; }
        .slash-3x { background-color: #ff4757; box-shadow: 0 0 30px #ff4757, 0 0 50px #ffffff; height: 50px; animation: slashAnimSuper 0.3s ease-out; }
        @keyframes slashAnimation { 0% { opacity: 0; transform: rotate(-45deg) translate(-100%, -100%); } 50% { opacity: 1; } 100% { opacity: 0; transform: rotate(-45deg) translate(100%, 100%); height: 2px; } }
        @keyframes slashAnimCrit { 0% { opacity: 0; transform: rotate(-45deg) translate(-100%, -100%) scale(1); } 50% { opacity: 1; transform: rotate(-45deg) translate(0, 0) scale(1.3); } 100% { opacity: 0; transform: rotate(-45deg) translate(100%, 100%) scale(1); height: 2px; } }
        @keyframes slashAnimSuper { 0% { opacity: 0; transform: rotate(-45deg) translate(-100%, -100%) scale(1.5); } 50% { opacity: 1; transform: rotate(-45deg) translate(0, 0) scale(2); } 100% { opacity: 0; transform: rotate(-45deg) translate(100%, 100%) scale(1.5); height: 5px; } }
        .boss-shake { animation: bossShakeAnim 0.15s ease-in-out; }
        .boss-shake-super { animation: bossShakeSuperAnim 0.3s ease-in-out; }
        @keyframes bossShakeAnim { 0% { transform: translate(0, 0); } 25% { transform: translate(5px, -5px); } 50% { transform: translate(-5px, 5px); } 75% { transform: translate(5px, 5px); } 100% { transform: translate(0, 0); } }
        @keyframes bossShakeSuperAnim { 0% { transform: translate(0, 0) scale(1); } 20% { transform: translate(15px, -15px) scale(1.1); filter: brightness(1.5); } 40% { transform: translate(-15px, 15px) scale(0.9); filter: brightness(0.8); } 60% { transform: translate(15px, 15px) scale(1.1); filter: brightness(1.5); } 80% { transform: translate(-15px, -15px) scale(0.9); filter: brightness(0.8); } 100% { transform: translate(0, 0) scale(1); } }
        .player-hit { animation: playerHitAnim 0.25s ease; }
        @keyframes playerHitAnim { 0% { border: 2px solid transparent; } 50% { border: 2px solid #ff4757; box-shadow: 0 0 15px #ff4757; } 100% { border: 2px solid transparent; } }
        .damage-text { position: absolute; color: #ff4757; font-size: 2rem; font-weight: bold; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 10; }
        .crit-damage { color: #ffdd59; font-size: 2.8rem; text-shadow: 0 0 15px #ff4757, 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
        .super-crit-damage { color: #ff3838; font-size: 4rem; text-shadow: 0 0 30px #ff4757, 0 0 10px #ffdd59, 2px 2px 0 #000, -2px -2px 0 #000; z-index: 20; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .crit-text { color: #ff4757 !important; transform: scale(1.3); text-shadow: 0 0 10px #ff4757; }

        #question-area { text-align: center; margin-bottom: 20px; }
        #question-text { font-size: 1.25rem; color: #7bed9f; margin-bottom: 15px; min-height: 4rem; white-space: pre-wrap; display: flex; align-items: center; justify-content: center; line-height: 1.4; padding: 0 10px;}
        #options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background-color: #57606f; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        .option-btn:hover { background-color: #747d8c; }
        .option-btn:active { transform: scale(0.95); }

        /* 模態框共用設定 */
        .modal-bg { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); border-radius: 12px; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 40; }
        
        /* 商店專用樣式 */
        .shop-header { color: #ffdd59; font-size: 2rem; margin-bottom: 5px; font-weight: bold; text-shadow: 0 0 10px #ffa502; }
        .shop-list-container { width: 100%; flex-grow: 1; overflow-y: auto; background: #2f3542; border-radius: 8px; padding: 10px; margin-bottom: 15px; max-height: 350px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid #57606f; }
        .shop-item:last-child { border-bottom: none; }
        .shop-item-info { display: flex; flex-direction: column; align-items: flex-start; }
        .shop-item-name { color: #f5f5f5; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .shop-item-cost { color: #ffdd59; font-weight: bold; font-size: 0.95rem; }
        .buy-btn { background: #2ed573; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .buy-btn:hover { background: #26de81; transform: scale(1.05); }
        .buy-btn:active { transform: scale(0.95); }
        .buy-btn.disabled { background: #57606f; color: #a4b0be; cursor: not-allowed; transform: none; }
        .action-btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .inventory-btn { background: #1e90ff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; width: 100%; font-weight: bold; }
        .close-modal-btn { background: #ff4757; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; width: 100%; font-weight: bold; }

        .modal-title { color: #ff4757; font-size: 2rem; margin-bottom: 10px; }
        .compare-box { text-align: center; margin-bottom: 20px; width: 100%; }
        .correct-answer { color: #2ed573; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .wrong-answer { color: #ff4757; font-size: 1.2rem; text-decoration: line-through; margin-top: 5px; }
        .details-list { width: 100%; background-color: #2f3542; border-radius: 8px; padding: 10px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #57606f; font-size: 0.95rem; }
        .detail-item:last-child { border-bottom: none; }
        .detail-en { color: #eccc68; font-weight: bold; width: 35%; display: flex; align-items: center; }
        .detail-pos { color: #a4b0be; width: 15%; text-align: center; }
        .detail-zh { color: #ffffff; width: 50%; text-align: right; }
        .audio-btn { background: rgba(255, 255, 255, 0.1); border: none; border-radius: 50%; margin-left: 8px; cursor: pointer; font-size: 1rem; padding: 4px 6px; color: white; transition: background 0.2s, transform 0.1s; }
        .resume-btn { background-color: #1e90ff; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; width: 100%; font-weight: bold; }
        
        .milestone-title { color: #ffdd59; font-size: 2.8rem; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 15px #ffa502, 0 0 30px #ff4757; text-align: center; }
        .milestone-desc { color: #f5f5f5; font-size: 1.35rem; margin-bottom: 30px; line-height: 1.6; text-align: center; padding: 0 10px; }
        .bubu-reward { color: #ff4757; font-size: 1.6rem; font-weight: bold; margin-bottom: 30px; background: #ffeaa7; padding: 12px 25px; border-radius: 12px; animation: pulseBubu 1s infinite alternate; text-shadow: 0px 0px 5px rgba(255, 71, 87, 0.5); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        @keyframes pulseBubu { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    </style>
</head>
<body>

<audio id="bgm" loop>
    <source src="Jamie Rutherford - For Kathy.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <div id="start-screen">
        <div class="title-text">⚔️ 單字防禦戰 ⚔️</div>
        <button class="start-btn" id="main-start-btn" onclick="startGame()">Start Game</button>
        <button class="reset-btn" onclick="resetProgress()">重新開始 (清除存檔)</button>
    </div>

    <div id="transition-screen">
        <div id="transition-text" class="transition-text">深入地城中...</div>
        <div class="walking-anim">🚶‍♂️ 💨</div>
    </div>

    <div id="special-alert">🎉 突發！特別關卡！<br>金幣獎勵雙倍 🎉</div>

    <div class="modal-bg" id="milestone-modal">
        <div class="milestone-title" id="milestone-title">破曉之光</div>
        <div class="milestone-desc" id="milestone-desc">恭喜突破！單字的光芒已照亮你的地城冒險！</div>
        <div class="bubu-reward" id="milestone-bubu" style="display: none;">🎁 可以跟布布領獎囉 🎁</div>
        <button class="resume-btn" onclick="closeMilestone()">收下榮耀，繼續冒險</button>
    </div>

    <!-- 商店介面 -->
    <div class="modal-bg" id="shop-modal" style="z-index: 45;">
        <div class="shop-header">🛒 布布專屬兌換所</div>
        <div style="color: #a4b0be; margin-bottom: 15px; font-size: 1.1rem;">持有金幣：<span id="shop-coin-display" style="color:#ffdd59; font-weight:bold;">0</span></div>
        <div class="shop-list-container" id="shop-list">
            <!-- 商店品項將透過 JS 生成 -->
        </div>
        <div class="action-btn-group">
            <button class="inventory-btn" onclick="openInventory()">🎒 查看已兌換獎勵</button>
            <button class="close-modal-btn" onclick="closeShop()">離開商店</button>
        </div>
    </div>

    <!-- 我的戰利品介面 -->
    <div class="modal-bg" id="inventory-modal" style="z-index: 46;">
        <div class="shop-header">🎒 我的戰利品</div>
        <div style="color: #a4b0be; margin-bottom: 15px; font-size: 1rem;">記錄你努力過關的豐碩果實！</div>
        <div class="shop-list-container" id="inventory-list">
            <!-- 兌換紀錄將透過 JS 生成 -->
        </div>
        <button class="close-modal-btn" onclick="closeInventory()">返回商店</button>
    </div>

    <div id="level-display">Level 1</div>

    <div id="status-bar">
        <div class="stat-box">HP: <span id="player-hearts" class="heart">❤️❤️❤️</span></div>
        <div class="stat-box">
            💰 <span id="coin-counter" class="coin-text">0</span>
            <button class="shop-icon-btn" onclick="openShop()">🛒商店</button>
        </div>
        <div class="stat-box">Combo: <span id="combo-counter" style="color:#ffa502; transition:0.2s;">0</span></div>
        <div class="stat-box">BOSS: <span id="boss-hp" class="boss-hp-text">10</span></div>
    </div>

    <div id="boss-area">
        <span id="boss-emoji">👾</span>
        <div id="slash-effect" class="attack-slash"></div>
    </div>

    <div id="question-area">
        <div id="question-text">載入中...</div>
        <div id="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)" id="btn-0"></button>
            <button class="option-btn" onclick="checkAnswer(1)" id="btn-1"></button>
            <button class="option-btn" onclick="checkAnswer(2)" id="btn-2"></button>
            <button class="option-btn" onclick="checkAnswer(3)" id="btn-3"></button>
        </div>
    </div>

    <div class="modal-bg" id="error-modal">
        <div class="modal-title">答錯了扣血！</div>
        <div class="compare-box">
            <div id="modal-correct" class="correct-answer"></div>
            <div id="modal-wrong" class="wrong-answer"></div>
        </div>
        <div class="details-list" id="modal-details"></div>
        <button class="resume-btn" onclick="resumeGame()">確認並繼續</button>
    </div>
</div>

<script src="words.js"></script>

<script>
    // 商店品項設定 (自動依需求金幣排序)
    const shopItems = [
        { name: "1瓶飲料 (布布指定款)", cost: 8000 },
        { name: "特調咖啡/手搖飲 1 杯", cost: 15000 },
        { name: "點心/下午茶一份", cost: 25000 },
        { name: "電影票 1 張", cost: 50000 },
        { name: "平價美味晚餐", cost: 90000 },
        { name: "中級美味晚餐", cost: 150000 },
        { name: "高級美味晚餐", cost: 250000 },
        { name: "布布帶妳出去玩", cost: 350000 }
    ].sort((a, b) => a.cost - b.cost);

    let redeemedItems = []; // 戰利品庫

    const milestoneMessages = [
        { title: "破曉之光", msg: "恭喜突破！單字的光芒已照亮你的地城冒險！" },
        { title: "潛力爆發", msg: "你的單字庫正在進化，繼續維持這股勢頭！" },
        { title: "地城探險者", msg: "踏出這一步，你已遠離新手區，表現優異！" },
        { title: "記憶之鑰", msg: "每多學一個單字，你便離傳說更近了一分！" },
        { title: "初試啼聲", msg: "你已經證明了自己，這是屬於你的勝利里程碑。" },
        { title: "專注的力量", msg: "你的專注力與記憶力正在顯著提升，加油！" },
        { title: "單字獵人", msg: "BOSS 在你面前節節敗退，持續獵捕更多詞彙！" },
        { title: "地城開拓者", msg: "這一關你開拓了領土，前方的風景會更壯觀！" },
        { title: "進化中的大腦", msg: "你正不斷打破自己的紀錄，這是進化的證明！" },
        { title: "榮耀時刻", msg: "這一刻屬於你，讓單字成為你最強的武器！" },
        { title: "地城征服者", msg: "敵人已倒下，你的單字防禦網越來越堅固了！" },
        { title: "卓越的記憶", msg: "看見這串文字了嗎？這是你努力堆砌的榮耀！" },
        { title: "勇者之姿", msg: "你的單字量正以驚人的速度成長，勢不可擋！" },
        { title: "知識的領地", msg: "恭喜！你又佔領了一塊新的單字領土。" },
        { title: "風暴般的成長", msg: "你的表現像風暴一樣席捲戰場，繼續前進！" },
        { title: "智慧的試煉", msg: "你通過了智慧的試煉，前方的地城更耀眼了。" },
        { title: "無懈可擊", msg: "單字防禦戰中，沒有什麼能阻擋你的腳步！" },
        { title: "地城主宰者", msg: "主宰單字，主宰這場戰鬥，你做得很好！" },
        { title: "傳說的序章", msg: "這一關只是開始，真正的傳說由你定義！" },
        { title: "MVP 認證", msg: "你就是 MVP！你的單字實力已獲得地城認證！" }
    ];

    const bossSkins = ['👾', '👹', '👺', '👻', '👽', '🤖', '🦇', '🧛', '🧟'];
    const specialBossSkins = ['🐲', '🌋', '👁️', '👿', '🦹‍♂️'];

    let currentLevel = 1;
    let wordQueue = [];
    let wrongWordsPool = []; 
    let seenWordsPool = []; 
    let bossHP = 0;
    let playerLives = 3;
    let combo = 0;
    let coins = 0;
    let isSpecialLevel = false;
    
    let currentTarget = null;
    let currentOptions = [];
    let isPaused = true; 
    let wasPausedBeforeShop = false; // 商店暫停狀態緩存
    let audioCtx = null;

    window.onload = loadProgress;

    function loadProgress() {
        let savedLevel = localStorage.getItem('vocabGameLevel');
        let savedCoins = localStorage.getItem('vocabGameCoins');
        let savedWrong = localStorage.getItem('vocabGameWrongWords');
        let savedSeen = localStorage.getItem('vocabGameSeenWords');
        let savedRedeemed = localStorage.getItem('vocabGameRedeemedItems');

        if (savedLevel) {
            currentLevel = parseInt(savedLevel);
            document.getElementById('main-start-btn').innerText = `繼續挑戰 (Level ${currentLevel})`;
        }
        if (savedCoins) coins = parseInt(savedCoins);
        if (savedWrong) wrongWordsPool = JSON.parse(savedWrong);
        if (savedSeen) seenWordsPool = JSON.parse(savedSeen);
        if (savedRedeemed) redeemedItems = JSON.parse(savedRedeemed);
    }

    function saveProgress() {
        localStorage.setItem('vocabGameLevel', currentLevel);
        localStorage.setItem('vocabGameCoins', coins);
        localStorage.setItem('vocabGameWrongWords', JSON.stringify(wrongWordsPool));
        localStorage.setItem('vocabGameSeenWords', JSON.stringify(seenWordsPool));
        localStorage.setItem('vocabGameRedeemedItems', JSON.stringify(redeemedItems));
    }

    function resetProgress() {
        if(confirm("確定要清除所有進度，從 Level 1 重新開始嗎？\n(注意：已兌換的戰利品也會被清空喔！)")) {
            localStorage.removeItem('vocabGameLevel');
            localStorage.removeItem('vocabGameCoins');
            localStorage.removeItem('vocabGameWrongWords');
            localStorage.removeItem('vocabGameSeenWords');
            localStorage.removeItem('vocabGameRedeemedItems');
            currentLevel = 1;
            coins = 0;
            wrongWordsPool = [];
            seenWordsPool = [];
            redeemedItems = [];
            document.getElementById('main-start-btn').innerText = "Start Game";
            alert("進度已清除！");
        }
    }

    // ==========================================
    // 商店與戰利品系統
    // ==========================================
    function openShop() {
        wasPausedBeforeShop = isPaused; 
        isPaused = true; 
        document.getElementById('shop-modal').style.display = 'flex';
        document.getElementById('shop-coin-display').innerText = coins;
        renderShopItems();
    }

    function closeShop() {
        document.getElementById('shop-modal').style.display = 'none';
        isPaused = wasPausedBeforeShop; // 恢復開啟商店前的狀態
    }

    function renderShopItems() {
        let html = "";
        shopItems.forEach((item, index) => {
            let canAfford = coins >= item.cost;
            let btnClass = canAfford ? "buy-btn" : "buy-btn disabled";
            html += `
            <div class="shop-item">
                <div class="shop-item-info">
                    <span class="shop-item-name">${item.name}</span>
                    <span class="shop-item-cost">💰 ${item.cost.toLocaleString()}</span>
                </div>
                <button class="${btnClass}" onclick="redeemItem(${index})">兌換</button>
            </div>`;
        });
        document.getElementById('shop-list').innerHTML = html;
    }

    function redeemItem(index) {
        let item = shopItems[index];
        if (coins >= item.cost) {
            coins -= item.cost;
            
            // 記錄兌換時間
            let now = new Date();
            let timeString = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
            redeemedItems.push({ name: item.name, date: timeString });
            
            saveProgress();
            updateUI();
            document.getElementById('shop-coin-display').innerText = coins;
            renderShopItems(); // 重新渲染商店，更新按鈕狀態
            
            fireConfetti(80); // 兌換成功紙屑
            setTimeout(() => alert(`🎉 兌換成功：${item.name}！\n趕快截圖去跟布布領獎吧！`), 100);
        } else {
            alert("您的金幣不足，請加油過關！");
        }
    }

    function openInventory() {
        document.getElementById('shop-modal').style.display = 'none';
        document.getElementById('inventory-modal').style.display = 'flex';
        let html = "";
        
        if (redeemedItems.length === 0) {
            html = "<div style='text-align:center; color:#a4b0be; padding:30px 0;'>目前還沒有兌換任何獎勵喔！<br>趕快努力賺金幣吧！</div>";
        } else {
            // 反轉陣列，讓最新兌換的在最上面
            let reversedList = [...redeemedItems].reverse();
            reversedList.forEach(item => {
                html += `<div class="shop-item">
                    <div class="shop-item-name">🎁 ${item.name}</div>
                    <div style="font-size:0.8rem; color:#a4b0be;">${item.date}</div>
                </div>`;
            });
        }
        document.getElementById('inventory-list').innerHTML = html;
    }

    function closeInventory() {
        document.getElementById('inventory-modal').style.display = 'none';
        document.getElementById('shop-modal').style.display = 'flex';
    }


    function startGame() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgm = document.getElementById('bgm');
        bgm.volume = 0.3; 
        bgm.play().catch(e => console.log("BGM 播放被阻擋:", e));
        document.getElementById('start-screen').style.display = 'none';
        initGameCore();
    }

    function initGameCore() {
        const hpOptions = [5, 8, 10, 12];
        let randomHP = hpOptions[Math.floor(Math.random() * hpOptions.length)];

        let currentLevelWords = autoGenerateLevel(currentLevel, randomHP);

        wordQueue = shuffleArray([...currentLevelWords]);
        bossHP = wordQueue.length;
        playerLives = 3;
        combo = 0;
        isPaused = false;

        isSpecialLevel = (currentLevel > 1 && Math.random() < 0.2);

        let bossSkin = "";
        let levelTextDisplay = document.getElementById('level-display');
        
        if (isSpecialLevel) {
            bossSkin = specialBossSkins[Math.floor(Math.random() * specialBossSkins.length)];
            levelTextDisplay.innerHTML = `Level ${currentLevel} <span style="color:#ffdd59; text-shadow: 0 0 5px #ff5252;">(💰 特別關卡 💰)</span>`;
            triggerSpecialAlert(); 
        } else {
            let bossIndex = (currentLevel - 1) % bossSkins.length;
            bossSkin = bossSkins[bossIndex];
            levelTextDisplay.innerText = `Level ${currentLevel}`;
        }
        
        document.getElementById('boss-emoji').innerText = bossSkin;
        updateUI();
        nextTurn();
    }

    function replenishQueue() {
        let groupIndex = Math.min(Math.ceil(currentLevel / 10), 20); 
        let key = "level" + groupIndex;
        let pool = wordDatabase[key] || wordDatabase.level1;
        
        if (!pool || pool.length === 0) return;
        
        let available = [];
        
        let advancedProb = 0;
        if (currentLevel >= 20) {
            advancedProb = 0.7; 
        } else if (currentLevel >= 15) {
            advancedProb = 0.4; 
        }
        
        if (advancedProb > 0 && Math.random() < advancedProb && typeof advancedQuestionPool !== 'undefined' && advancedQuestionPool.length > 0) {
            available = advancedQuestionPool.filter(w => 
                (w.en || w.target) !== currentTarget.target && 
                !wordQueue.find(wq => wq.target === (w.en || w.target)) &&
                !seenWordsPool.includes(w.en || w.target)
            );
            
            if (available.length === 0) {
                let advTargets = advancedQuestionPool.map(w => w.en || w.target);
                seenWordsPool = seenWordsPool.filter(t => !advTargets.includes(t));
                available = advancedQuestionPool.filter(w => 
                    (w.en || w.target) !== currentTarget.target && 
                    !wordQueue.find(wq => wq.target === (w.en || w.target))
                );
            }
        }
        
        if (available.length === 0) {
            available = pool.filter(w => 
                (w.en || w.target) !== currentTarget.target && 
                !wordQueue.find(wq => wq.target === (w.en || w.target)) &&
                !seenWordsPool.includes(w.en || w.target)
            );
            
            if (available.length === 0) {
                let poolTargets = pool.map(w => w.en || w.target);
                seenWordsPool = seenWordsPool.filter(t => !poolTargets.includes(t));
                available = pool.filter(w => 
                    (w.en || w.target) !== currentTarget.target && 
                    !wordQueue.find(wq => wq.target === (w.en || w.target))
                );
            }
        }
        
        if (available.length === 0) available = pool;
        
        let randomWord = available[Math.floor(Math.random() * available.length)];
        let finalTarget = randomWord.en || randomWord.target;
        
        wordQueue.push({
            type: randomWord.type || "vocab", 
            qText: randomWord.qText || randomWord.zh, 
            target: finalTarget, 
            pos: randomWord.pos, 
            zh: randomWord.zh 
        });
        
        seenWordsPool.push(finalTarget);
        saveProgress();
    }

    function autoGenerateLevel(level, targetCount = 5) {
        let groupIndex = Math.min(Math.ceil(level / 10), 20); 
        let key = "level" + groupIndex;
        
        let pool = wordDatabase[key] || wordDatabase.level1;
        if (!pool || pool.length === 0) {
            return [{ type: "vocab", qText: "題庫讀取錯誤", target: "error", pos: "n.", zh: "錯誤" }];
        }
        
        let selected = [];
        
        if (wrongWordsPool.length > 0) {
            let shuffledWrong = shuffleArray([...wrongWordsPool]);
            for(let i=0; i < shuffledWrong.length; i++) {
                if (Math.random() < 0.3 && selected.length < 2) {
                    selected.push(shuffledWrong[i]);
                }
            }
        }
        
        if (level >= 15 && typeof advancedQuestionPool !== 'undefined' && advancedQuestionPool.length > 0) {
            let availableAdvanced = advancedQuestionPool.filter(w => 
                !seenWordsPool.includes(w.en || w.target) && 
                !selected.find(s => s.target === (w.en || w.target))
            );
            
            if (availableAdvanced.length === 0) {
                let advTargets = advancedQuestionPool.map(w => w.en || w.target);
                seenWordsPool = seenWordsPool.filter(t => !advTargets.includes(t));
                availableAdvanced = advancedQuestionPool.filter(w => !selected.find(s => s.target === (w.en || w.target)));
            }

            let shuffledAdvanced = shuffleArray([...availableAdvanced]);
            
            let advancedCount = 0;
            if (level >= 20) {
                let minAdv = Math.max(2, Math.floor(targetCount * 0.4));
                let maxAdv = Math.floor(targetCount * 0.7);
                advancedCount = Math.floor(Math.random() * (maxAdv - minAdv + 1)) + minAdv;
            } else {
                advancedCount = Math.floor(Math.random() * 2) + 1; 
            }
            
            while(advancedCount > 0 && shuffledAdvanced.length > 0 && selected.length < targetCount) {
                let w = shuffledAdvanced.pop();
                let targetEn = w.en || w.target;
                selected.push({ 
                    type: w.type || "vocab", 
                    qText: w.qText || w.zh, 
                    target: targetEn, 
                    pos: w.pos, 
                    zh: w.zh 
                });
                seenWordsPool.push(targetEn);
                advancedCount--;
            }
        }
        
        let availableNormal = pool.filter(w => 
            !seenWordsPool.includes(w.en || w.target) && 
            !selected.find(s => s.target === (w.en || w.target))
        );
        
        if (availableNormal.length < (targetCount - selected.length)) {
            let poolTargets = pool.map(w => w.en || w.target);
            seenWordsPool = seenWordsPool.filter(t => !poolTargets.includes(t));
            availableNormal = pool.filter(w => !selected.find(s => s.target === (w.en || w.target)));
        }

        let shuffledNormal = shuffleArray([...availableNormal]);
        while(selected.length < targetCount && shuffledNormal.length > 0) {
            let w = shuffledNormal.pop();
            let targetEn = w.en || w.target;
            selected.push({ 
                type: w.type || "vocab", 
                qText: w.qText || w.zh, 
                target: targetEn, 
                pos: w.pos, 
                zh: w.zh 
            });
            seenWordsPool.push(targetEn);
        }
        
        saveProgress();
        return shuffleArray(selected);
    }

    function nextTurn() {
        if (playerLives <= 0) {
            playErrorSFX();
            alert(`💀 挑戰失敗... 將從 Level ${currentLevel} 重新開始。`);
            initGameCore();
            return;
        }

        if (bossHP <= 0) {
            let earnedCoins = isSpecialLevel ? 1000 : 500;
            coins += earnedCoins;
            updateUI();
            triggerLevelTransition(earnedCoins);
            return;
        }
        
        if (wordQueue.length === 0) {
            replenishQueue();
        }

        currentTarget = wordQueue.shift();
        
        let distractorsPool = [];
        
        if (currentTarget.type === "phrase") {
            const prepPool = ["up", "down", "in", "out", "on", "off", "over", "away", "back", "through", "about", "for", "with", "to", "at", "by", "into", "of"];
            distractorsPool = prepPool.map(p => ({ en: p, zh: "片語介系詞", pos: "prep./adv." }));
        } else if (currentTarget.isReview) {
            distractorsPool = wordDatabase.pdfLevel20 || wordDatabase.level20 || [];
        } else {
            distractorsPool = [...(typeof rawVocabulary !== 'undefined' ? rawVocabulary : []), ...(typeof advancedQuestionPool !== 'undefined' ? advancedQuestionPool : [])];
        }
        
        distractorsPool = distractorsPool.filter(w => (w.target || w.en) !== currentTarget.target);
        distractorsPool = shuffleArray(distractorsPool);
        
        let distractors = distractorsPool.slice(0, 3).map(w => ({ en: w.target || w.en, zh: w.zh, pos: w.pos }));
        let targetOpt = { en: currentTarget.target, zh: currentTarget.zh, pos: currentTarget.pos };
        
        currentOptions = shuffleArray([targetOpt, ...distractors]);

        document.getElementById('question-text').innerText = currentTarget.qText + (currentTarget.isReview ? " 🔄(複習)" : "");
        
        for (let i = 0; i < 4; i++) {
            let btn = document.getElementById(`btn-${i}`);
            if (currentOptions[i]) {
                btn.style.display = "inline-block";
                btn.innerText = currentOptions[i].en;
            } else {
                btn.style.display = "none";
            }
        }
    }

    function checkAnswer(selectedIndex) {
        if(isPaused) return;

        let pickedWord = currentOptions[selectedIndex];

        if (pickedWord.en === currentTarget.target) {
            
            if (currentTarget.type !== "phrase") {
                let safeTarget = currentTarget.target.replace(/'/g, "\\'");
                playSpeech(safeTarget);
            }

            if (currentTarget.isReview) {
                wrongWordsPool = wrongWordsPool.filter(w => w.target !== currentTarget.target);
                saveProgress();
            }

            combo++;
            
            let critType = 1; 
            let damage = 1;
            let roll = Math.random();
            
            if (roll < 0.05) { 
                damage = 3;
                critType = 3;
            } else if (roll < 0.20 || (combo > 0 && combo % 5 === 0)) { 
                damage = 2;
                critType = 2;
            }

            bossHP = Math.max(0, bossHP - damage);
            
            playAttackSFX(critType);
            triggerAttackAnimation(critType);
            spawnDamageText(damage, critType); 
            
            let comboText = document.getElementById('combo-counter');
            comboText.innerText = combo;
            
            if (critType > 1) {
                comboText.classList.add('crit-text');
                setTimeout(() => comboText.classList.remove('crit-text'), 300);
            }

            updateUI();
            isPaused = true; 
            setTimeout(() => { isPaused = false; nextTurn(); }, 350); 

        } else {
            
            if (!wrongWordsPool.find(w => w.target === currentTarget.target)) {
                let wrongWord = { 
                    type: currentTarget.type || "vocab", 
                    qText: currentTarget.qText.replace(" 🔄(複習)", ""), 
                    target: currentTarget.target, 
                    pos: currentTarget.pos, 
                    zh: currentTarget.zh,
                    isReview: true 
                };
                wrongWordsPool.push(wrongWord);
                saveProgress();
            }

            combo = 0;
            playerLives--;
            
            replenishQueue();

            playErrorSFX();
            triggerErrorAnimation();
            updateUI();
            isPaused = true;
            setTimeout(() => showErrorPanel(pickedWord), 300);
        }
    }

    // ==========================================
    // 特效與 UI 介面
    // ==========================================
    function spawnDamageText(damage, critType) {
        const bossArea = document.getElementById('boss-area');
        const dmgEl = document.createElement('div');
        
        dmgEl.className = 'damage-text';
        if (critType === 3) dmgEl.className += ' super-crit-damage';
        else if (critType === 2) dmgEl.className += ' crit-damage';
        
        dmgEl.innerText = '-' + damage;
        const randomX = (Math.random() - 0.5) * 80;
        const randomY = (Math.random() - 0.5) * 40; 
        dmgEl.style.left = `calc(50% + 30px + ${randomX}px)`; 
        dmgEl.style.top = `calc(30% + ${randomY}px)`;
        bossArea.appendChild(dmgEl);
        setTimeout(() => dmgEl.remove(), 800);
    }

    function fireConfetti(amount = 40) {
        const container = document.getElementById('game-container');
        const colors = ['#ff4757', '#ffdd59', '#1e90ff', '#2ed573', '#ffa502'];
        for(let i=0; i<amount; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + '%';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            conf.style.animationDelay = (Math.random() * 0.5) + 's';
            container.appendChild(conf);
            setTimeout(() => conf.remove(), 4000);
        }
    }

    function triggerLevelTransition(earnedCoins) {
        isPaused = true;
        const transScreen = document.getElementById('transition-screen');
        document.getElementById('transition-text').innerHTML = `獲得 <span style="color:#ffdd59">💰 ${earnedCoins}</span><br><br>前進 Level ${currentLevel + 1} ...`;
        transScreen.classList.add('show-transition');
        
        setTimeout(() => {
            currentLevel++;
            saveProgress();
            transScreen.classList.remove('show-transition');

            if (currentLevel % 10 === 0) {
                showMilestone();
            } else {
                initGameCore();
            }
        }, 2500);
    }

    function showMilestone() {
        const modal = document.getElementById('milestone-modal');
        const titleEl = document.getElementById('milestone-title');
        const descEl = document.getElementById('milestone-desc');
        const bubuEl = document.getElementById('milestone-bubu');
        
        let msgIndex = ((currentLevel / 10) - 1) % milestoneMessages.length;
        if(msgIndex < 0) msgIndex = 0;
        
        let msgData = milestoneMessages[msgIndex];
        titleEl.innerText = msgData.title;
        descEl.innerText = msgData.msg;

        if (currentLevel % 50 === 0) {
            bubuEl.style.display = 'block';
            fireConfetti(80); 
        } else {
            bubuEl.style.display = 'none';
            fireConfetti(40);
        }

        modal.style.display = 'flex';
    }

    function closeMilestone() {
        document.getElementById('milestone-modal').style.display = 'none';
        initGameCore();
    }

    function triggerSpecialAlert() {
        const alert = document.getElementById('special-alert');
        alert.classList.remove('alert-anim'); void alert.offsetWidth;
        alert.style.display = 'block'; alert.classList.add('alert-anim');
        fireConfetti(40); 
        setTimeout(() => alert.style.display = 'none', 2500);
    }

    function playAttackSFX(critType = 1) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        
        if (critType === 3) {
            osc.type = 'sawtooth'; 
            osc.frequency.setValueAtTime(400, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2); 
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (critType === 2) {
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15); 
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else {
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    function playErrorSFX() {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function playSpeech(word) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US'; window.speechSynthesis.speak(utterance);
    }

    function triggerAttackAnimation(critType = 1) {
        const slash = document.getElementById('slash-effect');
        slash.className = 'attack-slash'; 
        void slash.offsetWidth; 
        
        if (critType === 3) slash.classList.add('slash-3x');
        else if (critType === 2) slash.classList.add('slash-2x');
        else slash.classList.add('play-slash');
        
        const bossArea = document.getElementById('boss-area');
        bossArea.classList.remove('boss-shake', 'boss-shake-super'); 
        void bossArea.offsetWidth; 
        
        if (critType === 3) {
            bossArea.classList.add('boss-shake-super');
            setTimeout(() => bossArea.classList.remove('boss-shake-super'), 300);
        } else {
            bossArea.classList.add('boss-shake');
            setTimeout(() => bossArea.classList.remove('boss-shake'), 150);
        }
    }

    function triggerErrorAnimation() {
        const container = document.getElementById('game-container');
        container.classList.add('player-hit');
        setTimeout(() => container.classList.remove('player-hit'), 250);
    }

    function showErrorPanel(pickedWord) {
        document.getElementById('error-modal').style.display = 'flex';
        let safeTarget = currentTarget.target.replace(/'/g, "\\'");
        document.getElementById('modal-correct').innerHTML = `${currentTarget.target} <button class="audio-btn" onclick="playSpeech('${safeTarget}')">🔊</button>`;
        document.getElementById('modal-wrong').innerText = pickedWord.en;
        
        let detailsHTML = "";
        currentOptions.forEach(opt => {
            let safeOpt = opt.en.replace(/'/g, "\\'"); 
            detailsHTML += `<div class="detail-item">
                <span class="detail-en">${opt.en} <button class="audio-btn" onclick="playSpeech('${safeOpt}')">🔊</button></span>
                <span class="detail-pos">${opt.pos}</span>
                <span class="detail-zh">${opt.zh}</span>
            </div>`;
        });
        document.getElementById('modal-details').innerHTML = detailsHTML;
    }

    function resumeGame() {
        window.speechSynthesis.cancel();
        document.getElementById('error-modal').style.display = 'none';
        isPaused = false;
        nextTurn();
    }

    function updateUI() {
        document.getElementById('boss-hp').innerText = bossHP;
        document.getElementById('combo-counter').innerText = combo;
        document.getElementById('coin-counter').innerText = coins;
        let heartsStr = "";
        for(let i=0; i<3; i++) { heartsStr += (i < playerLives) ? "❤️" : "🖤"; }
        document.getElementById('player-hearts').innerText = heartsStr;
    }

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId); curId -= 1;
            let tmp = array[curId]; array[curId] = array[randId]; array[randId] = tmp;
        }
        return array;
    }
</script>
